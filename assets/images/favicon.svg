<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232E"/>
      <stop offset="100%" stop-color="#0E1116"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded hexagon / shield -->
  <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Tactical grid accent dots inside -->
  <circle cx="20" cy="18" r="1" fill="#D4AF37" opacity="0.3"/>
  <circle cx="32" cy="12" r="1" fill="#D4AF37" opacity="0.4"/>
  <circle cx="44" cy="18" r="1" fill="#D4AF37" opacity="0.3"/>

  <!-- Geometric Abstract Chess Knight Silhouette -->
  <!-- Mane, muzzle, neck, base composed of sharp strategic facets -->
  <path d="M 32 15
           C 29 15, 23 18, 21 24
           C 20 27, 21 29, 23 30
           C 20 31, 17 34, 18 38
           C 19 40, 22 41, 26 41
           L 27 44
           L 22 47
           L 22 51
           L 42 51
           L 42 47
           L 38 44
           L 38 37
           C 41 33, 43 27, 43 22
           C 43 17, 37 15, 32 15 Z"
        fill="url(#goldGrad)"
        filter="url(#glow)"/>

  <!-- Geometric Facet Lines on the Knight -->
  <path d="M 32 15 L 26 31 L 38 37 Z" fill="#FFF5D1" opacity="0.4"/>
  <path d="M 23 30 L 18 38 L 26 36 Z" fill="#946C0B" opacity="0.3"/>
  <circle cx="26" cy="24" r="1.5" fill="#0E1116"/>
</svg>

