<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="#0B0D10">
  <defs>
    <radialGradient id="ogGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#0B0D10" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B0D10" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E730B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0B0D10"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Strategic Chessboard Grid Accent -->
  <g opacity="0.07" stroke="#D4AF37" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Content Box -->
  <g transform="translate(100, 140)">
    <polygon points="50,10 90,32 90,78 50,100 10,78 10,32" fill="#151922" stroke="url(#ogGold)" stroke-width="2"/>
    <text x="120" y="65" font-family="'Cinzel', 'Outfit', sans-serif" font-size="48" font-weight="800" letter-spacing="6" fill="#FFFFFF">
      VERSA<tspan fill="url(#ogGold)">GAMBIT</tspan>
    </text>
    <text x="120" y="95" font-family="'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#9CA3AF">
      INDEPENDENT SOFTWARE STUDIO
    </text>

    <!-- Tagline -->
    <text x="10" y="210" font-family="'Cinzel', 'Outfit', serif" font-size="34" font-weight="600" letter-spacing="1.5" fill="#E5C07B">
      Think Strategically. Adapt Freely. Explore Endlessly.
    </text>

    <!-- Description -->
    <text x="10" y="270" font-family="'Inter', sans-serif" font-size="20" fill="#9CA3AF">
      Building useful, thoughtful, and adaptive digital applications across AI,
    </text>
    <text x="10" y="305" font-family="'Inter', sans-serif" font-size="20" fill="#9CA3AF">
      productivity, utilities, and experimental software.
    </text>

    <!-- Badges -->
    <rect x="10" y="350" width="180" height="40" rx="6" fill="#1C212D" stroke="#D4AF37" stroke-width="1"/>
    <text x="25" y="375" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#FCE588">De Code AI</text>
    <text x="110" y="375" font-family="'Inter', sans-serif" font-size="12" fill="#9CA3AF">In Dev</text>

    <rect x="210" y="350" width="160" height="40" rx="6" fill="#141820" stroke="#2D3748" stroke-width="1"/>
    <text x="230" y="375" font-family="'Inter', sans-serif" font-size="14" fill="#9CA3AF">Multi-Platform</text>

    <rect x="390" y="350" width="180" height="40" rx="6" fill="#141820" stroke="#2D3748" stroke-width="1"/>
    <text x="410" y="375" font-family="'Inter', sans-serif" font-size="14" fill="#9CA3AF">Independent Dev</text>
  </g>
</svg>

