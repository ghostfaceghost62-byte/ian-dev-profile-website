<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="logoShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232E"/>
      <stop offset="100%" stop-color="#0E1116"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Section (0 to 64) -->
  <g transform="translate(4, 2)">
    <!-- Hexagonal shield border -->
    <polygon points="28,3 53,16 53,44 28,57 3,44 3,16" fill="url(#logoShield)" stroke="url(#logoGold)" stroke-width="1.8"/>

    <!-- Subtle corner crosshairs -->
    <line x1="28" y1="0" x2="28" y2="4" stroke="#D4AF37" stroke-width="1.5" opacity="0.6"/>
    <line x1="28" y1="56" x2="28" y2="60" stroke="#D4AF37" stroke-width="1.5" opacity="0.6"/>

    <!-- Geometric Chess Knight Silhouette -->
    <path d="M 28 14
             C 25 14, 20 17, 18 22
             C 17 25, 18 27, 20 28
             C 17 29, 14 32, 15 36
             C 16 38, 19 39, 23 39
             L 24 42
             L 19 45
             L 19 48
             L 37 48
             L 37 45
             L 33 42
             L 33 35
             C 36 31, 38 26, 38 21
             C 38 16, 33 14, 28 14 Z"
          fill="url(#logoGold)"
          filter="url(#logoGlow)"/>

    <!-- Geometric Facet accents -->
    <path d="M 28 14 L 23 29 L 33 35 Z" fill="#FFF5D1" opacity="0.45"/>
    <circle cx="23" cy="22" r="1.5" fill="#0E1116"/>
  </g>

  <!-- Wordmark Section -->
  <text x="74" y="33" font-family="'Cinzel', 'Outfit', 'Inter', -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="3.5" fill="#FFFFFF">
    VERSA<tspan fill="url(#logoGold)">GAMBIT</tspan>
  </text>
  
  <text x="75" y="47" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="2.8" fill="#9CA3AF">
    INDEPENDENT SOFTWARE
  </text>
  
  <!-- Subtle accent dot -->
  <circle cx="258" cy="44" r="1.5" fill="#D4AF37"/>
</svg>

